name: Vale

on:
  # Vale is for documentation/prose quality. It runs only when Markdown or Vale
  # configuration changes, so it complements Super-Linter without adding noise
  # to source-only changes.
  pull_request:
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".github/styles/**"
      - ".github/workflows/vale.yml"
  push:
    branches:
      - "main"
    paths:
      - "**/*.md"
      - ".vale.ini"
      - ".github/styles/**"
      - ".github/workflows/vale.yml"
  workflow_dispatch:

# The Vale action reads repository content and reports findings back to the PR
# check. It does not need permission to modify files.
permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint_markdown_prose:
    name: Lint Markdown prose and terminology
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Run Vale
        uses: vale-cli/vale-action@v2.1.2
        with:
          # Pin the Vale CLI separately from the GitHub Action wrapper so prose
          # checks do not change behavior unexpectedly between runs.
          version: "3.14.1"
          # Check tracked documentation paths, not generated local ASV
          # environments such as .asv/ or .asv-openmp/.
          files: '["README.md", "CONTRIBUTING.md", "AUTHORS.md", "CHANGELOG.md", "benchmarks"]'
          filter_mode: nofilter
          reporter: github-check
          fail_on_error: true
