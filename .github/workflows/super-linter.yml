name: Super-Linter

on:
  # This workflow is cheap compared with ASV/compiler checks, so run it on
  # every PR and push to main to catch workflow/configuration issues early.
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

# Super-Linter needs read access and a status check permission so it can report
# results back to the commit/PR. It does not need write access to repository
# contents.
permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint_repository_metadata:
    name: Lint GitHub Actions, YAML, and JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lint changed files only. This avoids introducing unrelated failures
          # from old Markdown/YAML while still checking new PR changes.
          VALIDATE_ALL_CODEBASE: false
          # Opt-in mode: these true values make Super-Linter skip Python and
          # Markdown. Ruff owns Python linting in main.yml, and vale.yml owns
          # Markdown prose/terminology checks.
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
